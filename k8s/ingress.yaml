apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vendor-ingress
  namespace: vendor
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: sales-app
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:286757679229:certificate/d177e09f-e457-4d3d-8b65-4e21e3fdb9d6
    # WebSocket support for API backend
    alb.ingress.kubernetes.io/conditions.vendor-backend: |
      [{"Field":"path-pattern","Values":["*"]}]
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=true,
      stickiness.type=lb_cookie,
      stickiness.lb_cookie.duration_seconds=86400
spec:
  ingressClassName: alb
  rules:
    - host: caasdiglobal.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vendor-backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendor-frontend
                port:
                  number: 80
    - host: www.caasdiglobal.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vendor-backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendor-frontend
                port:
                  number: 80


